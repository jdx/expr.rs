[package]
name = "expr-lang"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["@jdx"]
license = "MIT"
documentation = "https://docs.rs/expr-lang"
homepage = "https://github.com/jdx/expr.rs"
repository = "https://github.com/jdx/expr.rs"
description = "Implementation of expr language in Rust"
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/compat/cases.tsv",
    "/compat/errors.tsv",
    "/examples/**/*.rs",
    "/MIGRATION.md",
    "/src/**/*.pest",
    "/src/**/*.rs",
    "/tests/**/*.rs",
]

[features]
serde = ["dep:serde", "indexmap/serde"]

[lib]
name = "expr"

[dependencies]
base64 = "0.23"
indexmap = "2"
regex = "1"
thiserror = "2"
pest_derive = "2"
pest = "2"
log = "0.4"
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
once_cell = "1"

[dev-dependencies]
test-log = "0.2"
proptest = "1"
serde = "1"

[profile.dev]
debug = 1

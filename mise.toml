[tools]
"cargo:cargo-release" = "latest"
"cargo:pest_fmt" = "latest"
git-cliff = "latest"
watchexec = "latest"
"github:jdx/tak" = "0.0.5"

[settings]
cargo.binstall_native = true

[tasks.lint]
run = [
  "cargo clippy",
  "pestfmt src/expr.pest",
]

[tasks.test]
alias = "t"
depends = ["lint"]
run = "cargo test"

[tasks.perf]
run = [
  "cargo build --release --example expr-bench",
  "tak run",
]

[tasks."perf:record"]
run = [
  "cargo build --release --example expr-bench",
  "tak run --record",
]

[tasks.release]
run = [
  "cargo release -x",
]
